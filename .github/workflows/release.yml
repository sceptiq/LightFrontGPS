name: Release

# Pushing a version tag builds the downloadable mod package and publishes it
# as a GitHub release:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The package is named <project>-<version>.zip, where the project name comes
# from the repository itself and the version is the tag without its leading
# "v" -- so v1.0.0 produces LightFrontGPS-1.0.0.zip.
#
# GitHub attaches an automatic "Source code (zip)" to every release, but that
# is the whole repository -- workflow files, developer notes and all. This job
# builds the thing a player actually installs instead.
#
# Run it manually (Actions -> Release -> Run workflow) to test the packaging
# without publishing anything: the zip is then only attached to the workflow
# run.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test build (nothing is published)"
        default: "0.0.0-test"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine package name
        run: |
          set -euo pipefail
          project="${{ github.event.repository.name }}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "PROJECT=$project"           >> "$GITHUB_ENV"
          echo "VERSION=$version"           >> "$GITHUB_ENV"
          echo "PACKAGE=$project-$version.zip" >> "$GITHUB_ENV"
          echo "Building $project-$version.zip"

      # A malformed Lua file does not fail loudly -- UE4SS simply does not load
      # the mod, and that only shows up in game. Catch it before anyone
      # downloads the release. Lua 5.4 is the version UE4SS embeds.
      - name: Check Lua syntax
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          fail=0
          while IFS= read -r f; do
            if luac5.4 -p "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done < <(find Mods -name '*.lua' | sort)
          exit $fail

      # Staged in a clean directory so nothing from the repository can leak in.
      # The zip has no wrapper folder: extracting it into
      # FarMech/Binaries/Win64/ drops Mods/FieldAlignGPS exactly where UE4SS
      # expects it.
      - name: Assemble the package
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          pkg="$PWD/$PACKAGE"
          cp -r Mods "$stage/"
          cp LICENSE README.md "$stage/"
          find "$stage" -name '.DS_Store' -delete
          (cd "$stage" && zip -qr "$pkg" .)
          unzip -l "$pkg"

      - name: Attach to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT }}-${{ env.VERSION }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$PACKAGE" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
